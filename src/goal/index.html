<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>LilyAssist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="form">
    <h1 id="title"></h1>
    <p id="info" class="muted"></p>
    <input id="text" type="text" maxlength="120" autocomplete="off" required>
    <div class="buttons">
      <button type="submit" id="save"></button>
      <button type="button" id="skip" class="ghost"></button>
    </div>
  </form>
  <script src="goal.js"></script>
</body>
</html>
